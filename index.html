<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GetSetMart - Official Online Store & Business Portal</title>
  <link rel="icon" type="image/png" href="brand-logo-final.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #070709;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .container {
      max-width: 520px;
      width: 100%;
      background: #141414;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 44px 34px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9);
    }
    .brand-logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      object-fit: contain;
      background: #000;
      padding: 4px;
      border: 2px solid #ff1e27;
      margin-bottom: 20px;
      box-shadow: 0 0 30px rgba(255, 30, 39, 0.4);
    }
    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      color: #ffffff;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    p {
      color: #9aa0a6;
      font-size: 0.95rem;
      margin-bottom: 32px;
      line-height: 1.5;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 24px;
      border-radius: 9999px;
      font-weight: 800;
      text-decoration: none;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
    }
    .btn-admin {
      background: #ff1e27;
      color: #ffffff;
      box-shadow: 0 4px 20px rgba(255, 30, 39, 0.4);
    }
    .btn-admin:hover {
      background: #e00000;
      transform: translateY(-1px);
    }
    .btn-store {
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .btn-store:hover {
      background: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="brand-logo-final.png" alt="GetSetMart Logo" class="brand-logo">
    <h1>GET SET MART</h1>
    <p>Official E-Commerce Brand & Enterprise Business Suite</p>

    <div class="btn-group">
      <a href="/admin/" class="btn btn-admin">
        <span>🔐 Access ERP Admin Panel</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </a>
    </div>
  </div>

</body>
</html>
